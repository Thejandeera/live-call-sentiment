version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: sentiment_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callIntelligence}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-callIntelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  service-phrase:
    build:
      context: .
      dockerfile: service-phrase/Dockerfile
    container_name: service_phrase
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8002:8002"

  service-sentiment:
    build:
      context: .
      dockerfile: service-sentiment/Dockerfile
    container_name: service_sentiment
    restart: always
    env_file: .env
    ports:
      - "8003:8003"

  service-score:
    build:
      context: .
      dockerfile: service-score/Dockerfile
    container_name: service_score
    restart: always
    env_file: .env
    ports:
      - "8004:8004"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api_gateway
    restart: always
    depends_on:
      - service-phrase
      - service-sentiment
      - service-score
    env_file: .env
    environment:
      PHRASE_SERVICE_URL: http://service-phrase:8002/extract-keywords
      SENTIMENT_SERVICE_URL: http://service-sentiment:8003/analyze-sentiment
      SCORE_SERVICE_URL: http://service-score:8004/calculate-score
    ports:
      - "8000:8000"

volumes:
  pgdata:
